name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  testes:
    name: Testes (Java 21)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          # Cacheia o ~/.m2 entre execucoes.
          cache: maven

      # A suite roda no perfil "test", com H2 em memoria e Flyway desativado:
      # nao e preciso subir PostgreSQL aqui.
      - name: Rodar os testes
        run: ./mvnw --batch-mode test

      - name: Publicar relatorio dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
