spring.application.name=barbershop
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/barbershop_core_db}
spring.datasource.username=${DB_USERNAME:barberUser}
spring.datasource.password=${DB_PASSWORD:123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Precisa ser identica a do servico de autenticacao: e o unico acoplamento
# entre os dois. Divergencia quebra silenciosamente toda requisicao autenticada.
# O valor abaixo e default de DESENVOLVIMENTO — em producao, defina JWT_SECRET_KEY.
jwt-secret-key=${JWT_SECRET_KEY:MakeSureThisKeyIsReallyLongAndRandomMaybeCopyPasteFromAGenerator64Chars+}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
